---
name: ci
on:
  pull_request:
jobs:
  ok:
    runs-on: ubuntu-slim
    if: failure()
    permissions: {}
    timeout-minutes: 5
    needs:
      - test
      - lint
    steps:
      - run: exit 1
  test:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      AQUA_CONFIG: ${{ github.workspace }}/aqua.yaml
      AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua-policy.yaml
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          cache: true
          go-version: stable
      - run: go mod download
      - name: test
        run: |
          make coverage
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - run: aqua install
      -
        name: octocov
        env:
          OCTOCOV_GITHUB_TOKEN: ${{ github.token }}
        run: |
          aqua exec -- octocov
  lint:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    env:
      AQUA_CONFIG: ${{ github.workspace }}/aqua.yaml
      AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua-policy.yaml
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          cache: true
          go-version: stable
      - run: go mod download
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.65.2
      - run: aqua install
      - name: golangci-lint
        env:
          _go_version: ${{ steps.setup-go.outputs.go-version }}
        run: |
          golangci-lint run \
            --issues-exit-code 0 \
            --config .golangci.yml
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint
